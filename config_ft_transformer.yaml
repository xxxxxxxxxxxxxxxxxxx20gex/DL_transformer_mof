batch_size: 128
epochs: 60
eval_every_n_epochs: 2
# 预训练 checkpoint 目录（内含 best_transformer_model.pth）；当前为 InfoNCE 多视图预训练 Apr19_17-11-52
fine_tune_from: /home/DL_transformer_mof/exp/SSL/runs_multiview/Apr19_17-11-52/checkpoints
pretrained_model_file: best_transformer_model.pth
trained_with: multiview
# 微调独立输出根目录；运行名称为 Trans_{trained_with}_{data_name}_{seed}_{时间戳}
finetune_log_root: /home/DL_transformer_mof/exp/finetune
log_every_n_steps: 100
gpu: cuda:0
# 若训练第一步即段错误，保持 false；若需极致吞吐且环境稳定可改 true
cudnn_benchmark: true
vocab_path: 'tokenizer/vocab_full.txt'
# CUDA 已在主进程初始化后，多进程 DataLoader（fork）易触发段错误，见 PyTorch 说明
num_workers: 0
task: 'regression'

optim:
  optimizer: Adam
  init_lr: 0.00005
  weight_decay: 1e-6
  new_layer_lr_multiplier: 200  # 新层学习率倍数
  base_layer_lr_multiplier: 1   # 基础层学习率倍数

dataloader:
  valid_ratio: 0.15
  test_ratio: 0.15
  use_ratio: 1
  randomSeed: 1

dataset:
  data_name: 'hMOF_CO2_0.5'
  dataPath: './benchmark_datasets/hMOF/mofid/hMOF_CO2_0.5_small_mofid.csv'
  # data_name: 'QMOF'
  # dataPath: '/root/autodl-tmp/MOFormer/benchmark_datasets/QMOF/mofid/QMOF_small_mofid.csv'

Transformer:
  ntoken: 4021
  d_model: 512
  nhead: 8
  d_hid: 512
  nlayers: 6
  dropout: 0.1
