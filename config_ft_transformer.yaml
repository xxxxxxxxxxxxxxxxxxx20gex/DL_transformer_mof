batch_size: 128
epochs: 30
eval_every_n_epochs: 2
fine_tune_from: ./ckpt/pretraining
trained_with: 'Transformer'
log_every_n_steps: 50
gpu: cuda:0  # 修改为cuda:0（您的系统只有一个GPU）
vocab_path: 'tokenizer/vocab_full.txt'
num_workers: 0
task: 'regression'

optim:
  optimizer: AdamW  # 优化器: Adam, AdamW (推荐), SGD
  init_lr: 0.00005
  weight_decay: 0.01  # AdamW推荐使用更大的weight_decay (0.01-0.1)
  new_layer_lr_multiplier: 10   # 新层学习率倍数 (LoRA: 10-20, 标准微调: 200)
  base_layer_lr_multiplier: 1   # 基础层学习率倍数

scheduler:
  type: 'CosineAnnealingLR'  # 学习率调度类型: CosineAnnealingLR, StepLR, None
  T_max: 30                   # 余弦周期（通常设为总epochs）
  eta_min: 0.000001           # 最小学习率

lora:
  enable: true                # 是否启用 LoRA (Low-Rank Adaptation)
  r: 16                       # LoRA rank (秩) - 增加表达能力
  lora_alpha: 32              # LoRA alpha (缩放因子) - 保持为 r 的 2倍
  lora_dropout: 0.1           # LoRA dropout
  target_modules: ['self_attn.out_proj', 'linear1', 'linear2']  # 应用到 Attention + FFN
  # 设置 enable: false 可禁用 LoRA，退回到普通微调

dataloader:
  valid_ratio: 0.15
  test_ratio: 0.15
  use_ratio: 1
  randomSeed: 1

dataset:
  data_name: 'hMOF_CO2_0.5'
  dataPath: './benchmark_datasets/hMOF/mofid/hMOF_CO2_0.5_small_mofid.csv'
  # data_name: 'QMOF'
  # dataPath: '/root/autodl-tmp/MOFormer/benchmark_datasets/QMOF/mofid/QMOF_small_mofid.csv'

Transformer:
  ntoken: 4021
  d_model: 512
  nhead: 8
  d_hid: 512
  nlayers: 6
  dropout: 0.1
  pos_encoding_type: 'relative'  # 位置编码类型: 'sinusoidal', 'learnable', 'relative'
