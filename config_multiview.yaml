batch_size: 256
epochs: 50
eval_every_n_epochs: 1
save_every_n_epochs: 5  # 每5个epoch保存一次检查点
# 统一输出根：TensorBoard、checkpoints 在 <ssl_exp_root>/runs_multiview/<时间>/；日志在 <ssl_exp_root>/logs/
ssl_exp_root: /home/DL_transformer_mof/exp/SSL
fine_tune_from: None
log_every_n_steps: 50
gpu: cuda:0
vocab_path: 'tokenizer/vocab_full.txt'
cuda: true
use_amp: true
pin_memory: true

optim:
  optimizer: Adam
  init_lr: 0.00001
  weight_decay: 1e-6

model_cgcnn: 
  atom_fea_len: 64
  h_fea_len: 512
  n_conv: 3
  n_h: 1

graph_dataset:
  root_dir: /home/DL_transformer_mof/cif
  cache_dir: /mnt/WujieAITeam/private/lyq/cif_cache
  use_graph_cache: true
  max_num_nbr: 12
  radius: 8
  dmin: 0
  step: 0.2
  random_seed: 666

dataloader:
  val_ratio: 0.05   # Please change here if you using the entire cif files, change to 0.05 as mentioned in SI of the paper
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 4

# CLIP 式跨模态对比（对称 InfoNCE）；原 Barlow Twins 见 loss/barlow_twins.py
clip_loss:
  temperature: 0.07


celoss:
  epsilon: 0.5

Transformer:
  ntoken: 4021
  d_model: 512
  nhead: 8
  d_hid: 512
  nlayers: 6
  dropout: 0.1
